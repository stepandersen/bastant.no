name: Bygg og publiser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6
      - name: Sett opp pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Sett opp Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Sett opp GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile
      - name: Bygg nettstedet
        run: pnpm exec eleventy --pathprefix="${{ steps.pages.outputs.base_path }}"
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Last opp nettstedet
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
